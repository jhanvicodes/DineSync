<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — DineSync</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="nav-logo"><span class="nav-logo-dine">Dine</span><span class="nav-logo-sync">Sync</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/restaurants.html">Restaurants</a></li>
      <li><a href="/my-reservations.html" id="nav-my-reservations" style="display:none;">My Reservations</a></li>
    </ul>
    <div class="nav-actions">
      <a href="/profile.html" id="nav-profile" class="btn btn-ghost btn-sm active nav-profile-link" style="display:none;"><span class="nav-profile-icon" aria-hidden="true">👤</span><span>Profile</span></a>
      <a href="/login.html" id="nav-login" class="btn btn-ghost btn-sm">Log In</a>
      <a href="/signup.html" id="nav-signup" class="btn btn-primary btn-sm">Sign Up</a>
      <button id="nav-logout" class="btn btn-outline btn-sm" style="display:none;" onclick="logout()">Log Out</button>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="container">
    <h1>My Profile</h1>
    <p>Manage your account information</p>
  </div>
</div>

<!-- MAIN -->
<div class="section">
  <div class="container" style="max-width:680px;">
    <div class="card" style="padding:var(--space-xl);">
      <!-- Avatar -->
      <div style="text-align:center; margin-bottom:var(--space-xl);">
        <div id="profile-avatar" style="width:80px; height:80px; border-radius:50%; background:var(--primary-light); color:var(--primary); font-size:2rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-md);">?</div>
        <h2 id="profile-display-name" style="font-family:var(--font-serif); font-size:1.4rem;"></h2>
        <span class="badge badge-info" id="profile-role-badge">Customer</span>
      </div>

      <form id="profile-form">
        <div class="form-group">
          <label for="profile-name">Full Name</label>
          <input type="text" id="profile-name" class="form-control" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="profile-email">Email Address</label>
          <input type="email" id="profile-email" class="form-control" disabled style="background:var(--bg-section);">
          <p style="font-size:0.78rem; color:var(--text-muted); margin-top:6px;">Email cannot be changed.</p>
        </div>

        <div class="form-group">
          <label for="profile-phone">Phone Number</label>
          <input type="tel" id="profile-phone" class="form-control" placeholder="+91 98765 43210">
        </div>

        <div style="display:flex; gap:var(--space-md);">
          <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
          <a href="/my-reservations.html" class="btn btn-outline btn-lg">My Reservations</a>
        </div>
      </form>
    </div>

    <!-- Quick Links -->
    <div class="card" style="padding:var(--space-xl); margin-top:var(--space-lg);">
      <h3 style="font-family:var(--font-serif); font-size:1.1rem; margin-bottom:var(--space-md);">Quick Actions</h3>
      <div style="display:flex; gap:var(--space-md); flex-wrap:wrap;">
        <a href="/restaurants.html" class="btn btn-outline">🍽️ Browse Restaurants</a>
        <a href="/my-reservations.html" class="btn btn-outline">📅 My Reservations</a>
        <button onclick="logout()" class="btn btn-danger">Sign Out</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const user = Session.get();
    if (!user) { window.location.href = '/login.html'; return; }

    // Set avatar and display name
    document.getElementById('profile-avatar').textContent = user.name[0].toUpperCase();
    document.getElementById('profile-display-name').textContent = user.name;
    document.getElementById('profile-role-badge').textContent = user.role === 'ADMIN' ? '🔧 Admin' : '👤 Customer';
  });
</script>
</body>
</html>
