<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reservations — DineSync</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/reservation.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="nav-logo">Dine<span>Sync</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/restaurants.html">Restaurants</a></li>
      <li><a href="/my-reservations.html" class="active" id="nav-my-reservations">My Reservations</a></li>
    </ul>
    <div class="nav-actions">
      <span id="nav-username" style="font-size:0.88rem; font-weight:600; color:var(--text-muted);"></span>
      <a href="/profile.html" id="nav-profile" class="btn btn-ghost btn-sm" style="display:none;">Profile</a>
      <a href="/login.html" id="nav-login" class="btn btn-ghost btn-sm">Log In</a>
      <a href="/signup.html" id="nav-signup" class="btn btn-primary btn-sm">Sign Up</a>
      <button id="nav-logout" class="btn btn-outline btn-sm" style="display:none;" onclick="logout()">Log Out</button>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="container">
    <h1>My Reservations</h1>
    <p>Manage your upcoming and past table bookings</p>
  </div>
</div>

<!-- MAIN -->
<div class="section">
  <div class="container">
    <!-- Tabs -->
    <div class="reservations-tabs">
      <button class="tab-btn active" data-tab="upcoming">📅 Upcoming</button>
      <button class="tab-btn" data-tab="past">📋 Past &amp; Cancelled</button>
    </div>

    <!-- Reservations list -->
    <div id="reservations-container">
      <div class="spinner-overlay"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- MODIFY MODAL -->
<div class="modal-overlay" id="modify-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Modify Reservation</h3>
      <button class="modal-close" id="modify-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <p class="text-muted mb-4" style="font-size:0.88rem;">Update the date, time, or number of guests for your reservation.</p>
      <div class="form-group">
        <label for="modify-date">Date</label>
        <input type="date" id="modify-date" class="form-control">
      </div>
      <div class="form-group">
        <label for="modify-time">Time</label>
        <select id="modify-time" class="form-control">
          <option value="11:30">11:30 AM</option>
          <option value="12:00">12:00 PM</option>
          <option value="13:00">1:00 PM</option>
          <option value="14:00">2:00 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="18:30">6:30 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="19:30">7:30 PM</option>
          <option value="20:00">8:00 PM</option>
          <option value="20:30">8:30 PM</option>
          <option value="21:00">9:00 PM</option>
        </select>
      </div>
      <div class="form-group">
        <label for="modify-guests">Number of Guests</label>
        <select id="modify-guests" class="form-control">
          <option value="1">1 Guest</option>
          <option value="2">2 Guests</option>
          <option value="3">3 Guests</option>
          <option value="4">4 Guests</option>
          <option value="5">5 Guests</option>
          <option value="6">6 Guests</option>
          <option value="8">8 Guests</option>
          <option value="10">10 Guests</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modify-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="modify-submit-btn">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/reservations.js"></script>
</body>
</html>
