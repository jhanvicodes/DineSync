# ============================================================
# DineSync - Application Configuration
# ============================================================
# Database credentials come ONLY from environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#
# Spring Boot does not load .env files automatically.
# Export the variables in your shell, or source a local .env
# before starting the app. See .env.example for names only.
#
# Example JDBC URL (replace with your project ref):
#   jdbc:postgresql://db.<YOUR-PROJECT-REF>.supabase.co:5432/postgres?sslmode=require
# ============================================================

# --- Database Connection (Supabase PostgreSQL via JDBC) ---
# No default credentials — unset variables will fail startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (HikariCP — built into Spring Boot) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# --- SQL Initialization (manual only; schema.sql is destructive and should not run against a live database) ---
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# --- Server ---
server.port=8080

# --- Static resources (HTML/CSS/JS served from resources/static) ---
spring.web.resources.static-locations=classpath:/static/

# --- Logging (keep it simple) ---
logging.level.com.dinesync=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# --- App name ---
spring.application.name=DineSync
